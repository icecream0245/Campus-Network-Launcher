[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruijie-eporta-tool"
version = "1.9.0"
description = "锐捷 ePortal 校园网自动登录工具：可视化界面、系统托盘、守护模式、掉线自动重连、开机自启（上游 Redlnn/Ruijie-ePorta-Tool 的本地迭代版）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Red_lnn", email = "w731347477@gmail.com" }]
keywords = ["ruijie", "eportal", "campus-network", "auto-login", "windows"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]
dependencies = ["PyYAML>=6.0", "pystray>=0.19.5", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyinstaller>=6.0", "black>=24.0"]

[project.urls]
Upstream = "https://github.com/Redlnn/Ruijie-ePorta-Tool"

[project.scripts]
ruijie-eporta = "ruijie_eporta.cli:main"

[tool.setuptools]
packages = ["ruijie_eporta"]
include-package-data = true

[tool.setuptools.package-data]
ruijie_eporta = ["assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312"]
skip-string-normalization = true
safe = true
